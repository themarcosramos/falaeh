<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fala Eh - Jogo da Fala">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="mic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Arredondado com Gradiente Espacial -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#8b5cf6" stroke-width="6" opacity="0.4"/>

  <!-- Brilhos / Estrelas -->
  <path d="M120 100 L124 116 L140 120 L124 124 L120 140 L116 124 L100 120 L116 116 Z" fill="#fbbf24" opacity="0.85"/>
  <path d="M400 140 L403 152 L415 155 L403 158 L400 170 L397 158 L385 155 L397 152 Z" fill="#fbbf24" opacity="0.85"/>
  <circle cx="390" cy="380" r="6" fill="#38bdf8" opacity="0.8"/>

  <!-- Mascote / Cabeça Amigável do Robozinho Eco com Microfone -->
  <!-- Antena -->
  <line x1="256" y1="130" x2="256" y2="85" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="75" r="22" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="256" cy="75" r="10" fill="#fef08a"/>

  <!-- Arco do Fone -->
  <path d="M140 240 C140 160 190 125 256 125 C322 125 372 160 372 240" stroke="#f59e0b" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Conchas do Fone de Ouvido -->
  <rect x="115" y="210" width="42" height="84" rx="21" fill="#ec4899" filter="url(#glow)"/>
  <rect x="355" y="210" width="42" height="84" rx="21" fill="#ec4899" filter="url(#glow)"/>

  <!-- Cabeça do Robô -->
  <rect x="156" y="145" width="200" height="175" rx="60" fill="#38bdf8" stroke="#0284c7" stroke-width="8"/>

  <!-- Visor do Rosto -->
  <rect x="180" y="175" width="152" height="110" rx="36" fill="#0f172a"/>

  <!-- Olhos Brilhantes Felizes -->
  <circle cx="218" cy="225" r="18" fill="#4ade80"/>
  <circle cx="224" cy="219" r="6" fill="#ffffff"/>
  <circle cx="294" cy="225" r="18" fill="#4ade80"/>
  <circle cx="300" cy="219" r="6" fill="#ffffff"/>

  <!-- Sorriso -->
  <path d="M236 254 Q256 270 276 254" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Bochechas Coradinhas -->
  <circle cx="198" cy="250" r="9" fill="#f43f5e" opacity="0.8"/>
  <circle cx="314" cy="250" r="9" fill="#f43f5e" opacity="0.8"/>

  <!-- Ícone do Microfone Central Destaque no Peitoral -->
  <rect x="232" y="340" width="48" height="75" rx="24" fill="url(#gold-grad)" filter="url(#glow)"/>
  <path d="M216 375 C216 405 234 425 256 425 C278 425 296 405 296 375" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" fill="none"/>
  <line x1="256" y1="425" x2="256" y2="455" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <line x1="230" y1="455" x2="282" y2="455" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
</svg>
