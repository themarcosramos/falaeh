# .golangci.yml — Configuração do golangci-lint (v2) para o Falaêh
# Módulo: github.com/themarcosramos/falaeh/backend
# Versão Go: 1.27.x

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - errorlint
    - exhaustive
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 45
    revive:
      rules:
        - name: exported
          disabled: false
        - name: blank-imports
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: dot-imports
          disabled: false
        - name: error-naming
          disabled: false
        - name: error-strings
          disabled: false
        - name: error-return
          disabled: false
        - name: errorf
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: indent-error-flow
          disabled: false
        - name: package-comments
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: time-naming
          disabled: false
        - name: unexported-return
          disabled: false
        - name: var-naming
          disabled: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/themarcosramos/falaeh/backend

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
