services:
  api:
    build:
      context: ./backend
      target: prod
    environment:
      APP_PORT: ${APP_PORT:-8080}
      FEEDBACK_GOOGLE_FORMS_URL: ${FEEDBACK_GOOGLE_FORMS_URL:-}
      FEEDBACK_GOOGLE_FORMS_ENTRY_ID: ${FEEDBACK_GOOGLE_FORMS_ENTRY_ID:-}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped
